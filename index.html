  <script>
    async function updateNowPlaying() {
      try {
        const res = await fetch("spotify.php");
        const data = await res.json();
        const el = document.getElementById("now-playing");
        if (data.playing) {
          el.innerHTML = `<img src="${data.albumArt}" alt="">♪ ${data.track} — ${data.artist}`;
        } else {
          el.innerHTML = "♪ not listening rn";
        }
      } catch (e) {
        // fail silently, don't clutter the page over a Spotify hiccup
      }
    }
    updateNowPlaying();
    setInterval(updateNowPlaying, 20000);
  </script>
